name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: IR Ring maths (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        run: make -C extras/test

  format:
    name: Code format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: pip install "clang-format==18.1.8"
      - name: Check formatting
        run: make -C extras/test format-check
