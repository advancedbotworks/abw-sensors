name: Release firmware

# Builds both firmware sketches and attaches the binaries to a GitHub Release.
#  - Runs automatically when a release is published (tag must match
#    library.properties, e.g. v3.0.0).
#  - Can also be run by hand (Actions -> Release firmware -> Run workflow):
#    builds from the chosen branch and uploads the files as a workflow
#    artifact (no release needed), e.g. for hardware testing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to the release

jobs:
  build:
    name: Build firmware binaries
    runs-on: ubuntu-latest
    env:
      FQBN: arduino:samd:nano_33_iot
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' library.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Release tag $tag doesn't match library.properties version $version (expected v$version)"
              exit 1
            fi
          fi

      - name: Check versions agree
        run: make -C extras/test check-version

      - uses: arduino/setup-arduino-cli@v2

      - name: Install SAMD core and dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd
          arduino-cli lib install VL53L1X

      - name: Compile
        run: |
          set -e
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          for sketch in IRRingFirmware LaserArrayFirmware; do
            arduino-cli compile --fqbn "$FQBN" --library . \
              --output-dir "build/$sketch" "examples/$sketch"
            cp "build/$sketch/$sketch.ino.bin" "dist/ABW-$sketch-v$v.bin"
            if [ -f "build/$sketch/$sketch.ino.hex" ]; then
              cp "build/$sketch/$sketch.ino.hex" "dist/ABW-$sketch-v$v.hex"
            fi
          done
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cat > dist/FLASHING.md <<EOT
          # Flashing prebuilt ABW firmware (v$v)

          Most people should use the Arduino IDE steps at
          https://docs.advancedbotworks.com/firmware/updating/ instead.
          These files are for advanced users and for checking exactly
          what was shipped.

          | File | Product |
          |---|---|
          | ABW-IRRingFirmware-v$v.bin | IR Sensor Ring |
          | ABW-LaserArrayFirmware-v$v.bin | Laser Distance Sensor Array |

          Board: Arduino NANO 33 IoT core (\`$FQBN\`), ATSAMD21G18A, via USB.

          With arduino-cli (unplug the sensor from the hub first):

              arduino-cli core install arduino:samd
              arduino-cli board list
              arduino-cli upload -p <PORT> -b $FQBN --input-file ABW-IRRingFirmware-v$v.bin

          Check the download with SHA256SUMS.txt.

          Source code for this firmware: the v$v release of
          https://github.com/advancedbotworks/abw-sensors (GPL-3.0-or-later).
          Third-party licences: THIRD_PARTY_NOTICES.md.
          EOT
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: abw-firmware-v${{ steps.version.outputs.version }}
          path: dist/

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
